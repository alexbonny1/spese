name: Update daily quotes

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-daily-quotes.mjs
      - run: |
          if ! git diff --quiet -- src/data/dailyQuotes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/dailyQuotes.json
            git commit -m "Aggiorna prezzi giornalieri"
            git push
          else
            echo "Nessuna variazione di prezzo, niente da committare."
          fi
