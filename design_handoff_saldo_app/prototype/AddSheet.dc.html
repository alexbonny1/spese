<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-8584ad11-aee2-400e-bd6e-b4bfcbaf6438/styles.css">
<script src="_ds/industry-8584ad11-aee2-400e-bd6e-b4bfcbaf6438/_ds_bundle.js"></script>
</helmet>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;font-family:var(--font-body);color:var(--color-text)">
  <div onClick="{{ close }}" style="position:absolute;inset:0;background:color-mix(in srgb, var(--color-neutral-900) 45%, transparent)"></div>
  <div style="position:relative;background:var(--color-bg);border-top:1px solid var(--color-divider);padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg)">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;border:1px solid var(--color-divider)">
        <button onClick="{{ setOut }}" style="border:0;cursor:pointer;padding:8px 16px;font-family:var(--font-heading);font-weight:600;font-size:15px;background:{{ outBg }};color:{{ outColor }}">− Uscita</button>
        <button onClick="{{ setIn }}" style="border:0;border-left:1px solid var(--color-divider);cursor:pointer;padding:8px 16px;font-family:var(--font-heading);font-weight:600;font-size:15px;background:{{ inBg }};color:{{ inColor }}">+ Entrata</button>
      </div>
      <button onClick="{{ close }}" class="btn btn-ghost" style="font-size:14px">Annulla</button>
    </div>
    <div style="display:flex;align-items:baseline;justify-content:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--color-divider)">
      <span style="font-family:var(--font-heading);font-size:28px;color:var(--color-accent-700)">{{ sign }} €</span>
      <span style="font-family:var(--font-heading);font-weight:600;font-size:56px;line-height:1;letter-spacing:-0.02em">{{ amountDisplay }}</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
        <button onClick="{{ c.pick }}" style="cursor:pointer;padding:5px 11px;font-family:var(--font-body);font-size:12px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.color }}">{{ c.name }}</button>
      </sc-for>
    </div>
    <sc-if value="{{ showRec }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ toggleRec }}" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px">
      <span style="display:flex;flex-direction:column"><span>{{ recLabel }}</span><span style="font-size:11px;color:var(--color-neutral-700)">{{ recHint }}</span></span>
      <span style="width:38px;height:20px;border:1px solid var(--color-divider);position:relative;background:{{ recTrack }}"><span style="position:absolute;top:2px;left:{{ recKnob }};width:14px;height:14px;background:{{ recKnobBg }}"></span></span>
    </button>
    </sc-if>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)">
      <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
        <button onClick="{{ k.press }}" style="cursor:pointer;height:46px;border:0;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);background:transparent;font-family:var(--font-heading);font-size:22px;color:var(--color-text)" style-active="background:var(--color-accent-100)">{{ k.label }}</button>
      </sc-for>
    </div>
    <button onClick="{{ save }}" disabled="{{ cantSave }}" class="btn btn-primary blueprint" style="height:48px;font-size:17px;width:100%">{{ saveLabel }}<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:760},&quot;initialType&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;out&quot;,&quot;in&quot;],&quot;default&quot;:&quot;out&quot;,&quot;tsType&quot;:&quot;'out'|'in'&quot;},&quot;onSave&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(tx)=&gt;void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { type: this.props.initialType || 'out', amount: '', cat: null, rec: false };
  press(k) {
    this.setState(s => {
      let a = s.amount;
      if (k === '⌫') a = a.slice(0, -1);
      else if (k === ',') { if (!a.includes(',')) a = (a || '0') + ','; }
      else { if (a.includes(',') && a.split(',')[1].length >= 2) return null; if (a.replace(',', '').length >= 7) return null; a = a === '0' ? k : a + k; }
      return { amount: a };
    });
  }
  renderVals() {
    const { type, amount, rec } = this.state;
    const out = type === 'out';
    const list = out ? ['Spesa', 'Ristoranti', 'Trasporti', 'Svago', 'Casa', 'Investimento', 'Altro'] : ['Stipendio', 'Extra', 'Rimborso', 'Regalo'];
    const cat = list.includes(this.state.cat) ? this.state.cat : list[0];
    const val = parseFloat((amount || '0').replace(',', '.'));
    const isInv = out && cat === 'Investimento';
    const on = 'var(--color-accent)';
    return {
      outBg: out ? on : 'transparent', outColor: out ? 'var(--color-bg)' : 'var(--color-text)',
      inBg: !out ? on : 'transparent', inColor: !out ? 'var(--color-bg)' : 'var(--color-text)',
      setOut: () => this.setState({ type: 'out' }), setIn: () => this.setState({ type: 'in' }),
      sign: out ? '−' : '+', amountDisplay: amount || '0',
      cats: list.map(n => ({ name: n, pick: () => this.setState({ cat: n }), bg: n === cat ? 'var(--color-accent-100)' : 'transparent', color: n === cat ? 'var(--color-accent-800)' : 'var(--color-text)', border: n === cat ? 'var(--color-accent)' : 'var(--color-divider)' })),
      recLabel: out ? 'Spesa fissa mensile' : 'Entrata fissa mensile',
      recHint: rec ? 'Si ripete ogni mese e conta nel calcolo dello spendibile' : 'Una tantum, solo oggi',
      toggleRec: () => this.setState(s => ({ rec: !s.rec })),
      recTrack: rec ? 'var(--color-accent-100)' : 'transparent', recKnob: rec ? '20px' : '2px', recKnobBg: rec ? 'var(--color-accent)' : 'var(--color-neutral-400)',
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', '⌫'].map(k => ({ label: k, press: () => this.press(k) })),
      cantSave: !(val > 0),
      showRec: !isInv,
      saveLabel: !(val > 0) ? 'Inserisci un importo' : isInv ? 'Continua: scegli il titolo' : `Salva ${out ? 'uscita' : 'entrata'}`,
      save: () => { if (val > 0) this.props.onSave && this.props.onSave({ type, amt: val, cat, rec: isInv ? false : rec }); },
      close: () => this.props.onClose && this.props.onClose()
    };
  }
}
</script>
</body>
</html>
